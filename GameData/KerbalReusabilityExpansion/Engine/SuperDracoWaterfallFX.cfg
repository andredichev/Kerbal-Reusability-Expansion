    MODULE
    {
        name = ModuleWaterfallFX
        moduleID = rcsFX
        engineID = basicEngine

        CONTROLLER
        {
            name = atmosphereDepth
            linkedTo = atmosphere_density
        }
        CONTROLLER
        {
            name = rcs
            linkedTo = rcs
        }
        TEMPLATE
        {
            templateName = template-nfs-rcs-small-1
            overrideParentTransform = RCSthruster
            position = 0,-0.03,0
            rotation = 0, 0, 180
            scale = 0.8, 1.3, 0.8
        }
    }
}
