        #LOC_KerbalReusabilityExpansion_DESC_VernierThruster = Усовершенствованная версия двигателя «Гуверньер» с дополнительными направлениями тяги. Работает на жидком топливе и окислителе.
        #LOC_KerbalReusabilityExpansion_DESC_GridFin = Изначально разработанная как попытка приготовить вафли увеличенного размера, эта деталь на деле отлично справляется с торможением и управлением ступенями ракеты при спуске. Обратите внимание: маленькая стрелка должна указывать в сторону космоса.
        #LOC_KerbalReusabilityExpansion_DESC_NemesisGridFin = Усовершенствованная конструкция решётчатого руля для тех случаев, когда нужно показать атмосфере, кто здесь главный. Хотя эта деталь заметно тяжелее и дороже базовой модели, повышенная термостойкость быстро окупит разницу.
