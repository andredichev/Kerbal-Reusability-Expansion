        #LOC_KerbalReusabilityExpansion_DESC_Trunk = Дополнительное багажное пространство для ваших полётов. Идеально подходит для хранения хрупких приборов или небольших служебных компонентов, таких как баки RCS, батареи и прочее.
        #LOC_KerbalReusabilityExpansion_DESC_TrunkFin = Небольшое крыло, созданное для того, чтобы космический корабль выглядел круто. Позже выяснилось, что оно также помогает с аэродинамической устойчивостью в случае аварийного прерывания полёта.
        #LOC_KerbalReusabilityExpansion_DESC_SuperDracoEngine = Высокая тяга при паршивой эффективности. Идеально подходит для посадки капсул и обеспечения возможности аварийного прерывания полёта.
