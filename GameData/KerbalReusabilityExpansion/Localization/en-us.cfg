        //PART DESCRIPTIONS
        #LOC_KerbalReusabilityExpansion_DESC_DragonFuelTank = A small heat-resistant fuel tank.
        #LOC_KerbalReusabilityExpansion_DESC_DragonHeatShield = A medium structural heat shield. Includes depolyable landing legs that make for a more elegant touchdown. The shroud acts as decoupler.
        #LOC_KerbalReusabilityExpansion_DESC_Trunk = Additional luggage space for your voyages. Ideal for storing delicate instruments or small service components such as RCS tanks, batteries, etc.
        #LOC_KerbalReusabilityExpansion_DESC_TrunkFin = A small wing designed to make spacecraft look cool. It was later discovered to also help with aerodynamic stability in case of an in-flight abort.
        #LOC_KerbalReusabilityExpansion_DESC_VernierThruster = An advanced version of the "Vernor" engine with additional thrust directions. It uses liquid fuel and oxidizer.
        #LOC_KerbalReusabilityExpansion_DESC_GridFin = Originally developed in an attempt to cook oversized waffles this part proved itself to reliably slow down and steer rocket stages on descent. Note that the small arrow needs to point towards space.
        #LOC_KerbalReusabilityExpansion_DESC_NemesisGridFin = An advanced grid fin design for when you really need to show the atmosphere who's in charge. While being significantly heavier and more expensive than the base model, the additional heat tolerance will make up for it in no time.
        #LOC_KerbalReusabilityExpansion_DESC_LT37 = So those are your landing legs huh? You've had them for years and they have never let you down? Your old landing legs are good enough right? WRONG! Introducing the brand new LT-37. Built to make the LT-2 pale in comparison. Go ahead! Humiliate the terrain. Devastate the environment. You deserve it!
        #LOC_KerbalReusabilityExpansion_DESC_NewShepardLandingLeg = Light landing legs for smaller stages. Warranty void if used for non-suborbital flights. This is not a drill.
        #LOC_KerbalReusabilityExpansion_DESC_ShepardLeg = Light landing legs for smaller stages.
        #LOC_KerbalReusabilityExpansion_DESC_FalconLandingGear = Landing legs for first stages.
        #LOC_KerbalReusabilityExpansion_DESC_FalconLandingGearMk2 = Mk2 landing legs for first stages.

