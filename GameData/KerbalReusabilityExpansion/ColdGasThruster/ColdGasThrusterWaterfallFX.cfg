@PART[HotGasThruster-M]:NEEDS[Waterfall]:FOR[KerbalReusabilityExpansion]
{
  // Removes the stock effect block, and replace it with one that has no particles
  !EFFECTS {}
  EFFECTS
  {
    running
    {
      AUDIO_MULTI_POOL
      {
        channel = Ship
        transformName = RCSThrust
				clip = sound_rocket_mini
				volume = 0.0 0.0
				volume = 0.1 0.0
				volume = 0.5 0.05
				volume = 1.0 0.5
				pitch = 0.0 0.5
				pitch = 1.0 1.0
				loop = true
      }
    }
  }
  MODULE
  {
    name = ModuleWaterfallFX
    // This is a custom name
    moduleID = RCSHotGasThrusterM
    // This links the effects to a given ModuleEngines
    engineID = basicEngine

    // List out all controllers we want available
    CONTROLLER
    {
      name = atmosphereDepth
      linkedTo = atmosphere_density
    }
    CONTROLLER
    {
      name = rcs
      linkedTo = rcs
	    responseRateUp = 0.7
	    responseRateDown = 0.7
    }
    CONTROLLER
    {
      name = R1
      linkedTo = random
      noiseType = perlin
      scale = 1
      minimum = 0
      speed = 12
      seed = 1
    }
    TEMPLATE
    {
      templateName = stock-rcs-jet-3
      overrideParentTransform = RCSThrust
      scale = 1,1,1
      rotation = 0,0,180
      position = 0,0,0
    }
    TEMPLATE
    {
      templateName = stock-rcs-core-3
      overrideParentTransform = RCSThrust
      scale = 1,1,1
      rotation = 0,0,180
      position = 0,0,0
    }
  }
}

